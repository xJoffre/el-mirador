spring.application.name=el-mirador
spring.config.import=optional:file:../.env[.properties]

app.zone=America/Guayaquil
app.photos=${PHOTOS_DIR:photos}
app.first-admin.name=${FIRST_ADMIN_NAME:}
app.first-admin.pin=${FIRST_ADMIN_PIN:}

spring.datasource.url=jdbc:postgresql://${POSTGRES_HOST:localhost}:5432/${POSTGRES_DB}
spring.datasource.username=${POSTGRES_USER}
spring.datasource.password=${POSTGRES_PASSWORD}
spring.datasource.hikari.connection-init-sql=SET TIME ZONE '${app.zone}'

spring.mvc.problemdetails.enabled=true

springdoc.writer-with-default-pretty-printer=true
springdoc.writer-with-order-by-keys=true

spring.jackson.property-naming-strategy=SNAKE_CASE
springdoc.default-produces-media-type=application/json

server.forward-headers-strategy=native
server.servlet.session.timeout=14h
server.servlet.session.cookie.same-site=lax
spring.servlet.multipart.max-file-size=15MB
spring.servlet.multipart.max-request-size=15MB
