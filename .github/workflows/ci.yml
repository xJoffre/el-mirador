name: ci

on:
  push:
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      POSTGRES_DB: el_mirador
      POSTGRES_USER: el_mirador
      POSTGRES_PASSWORD: el_mirador
      PGHOST: localhost
      PGDATABASE: el_mirador
      PGUSER: el_mirador
      PGPASSWORD: el_mirador
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_DB: el_mirador
          POSTGRES_USER: el_mirador
          POSTGRES_PASSWORD: el_mirador
        ports:
          - 5432:5432
        options: --health-cmd pg_isready --health-interval 5s --health-retries 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 25
          cache: maven
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: web
        working-directory: web
        run: |
          npm ci
          npm run lint
          npm test
          npm run build

      - name: backend
        working-directory: backend
        run: sh mvnw -B verify

      - name: migrations apply, roll back and apply again
        working-directory: backend
        run: >
          sh mvnw -B liquibase:updateTestingRollback
          -Dliquibase.url=jdbc:postgresql://localhost:5432/$POSTGRES_DB
          -Dliquibase.username=$POSTGRES_USER
          -Dliquibase.password=$POSTGRES_PASSWORD

      - name: every table and column has a comment
        run: psql -q -f scripts/smoke/comments.sql

      - name: dev seed
        run: psql -q -f scripts/dev-seed/seed.sql

      - name: the database rejects invalid data
        run: psql -q -f scripts/smoke/constraints.sql

      - name: start
        working-directory: backend
        run: |
          java -jar target/el-mirador-*.jar &
          curl -sf --retry 30 --retry-connrefused --retry-delay 2 http://localhost:8080/actuator/health

      - name: contract has no drift
        working-directory: web
        run: |
          npm run api
          git status --porcelain ../api src/shared/api
          test -z "$(git status --porcelain ../api src/shared/api)"

      - name: smoke
        run: |
          node scripts/smoke/base.ts http://localhost:8080
          node scripts/smoke/menu.ts http://localhost:8080
          node scripts/smoke/availability.ts http://localhost:8080
          node scripts/smoke/staff.ts http://localhost:8080
          node scripts/smoke/live.ts http://localhost:8080
          node scripts/smoke/orders.ts http://localhost:8080

      - name: end to end
        working-directory: web
        run: |
          npx playwright install --with-deps chromium
          npx playwright test

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24

      - name: compose up
        run: |
          sed 's/^POSTGRES_PASSWORD=$/POSTGRES_PASSWORD=ci/' .env.example > .env
          docker compose -f deploy/docker-compose.yml up -d --build --wait
          curl -sk --retry 30 --retry-all-errors --retry-delay 2 -o /dev/null https://localhost/actuator/health

      - name: smoke over https
        env:
          NODE_TLS_REJECT_UNAUTHORIZED: 0
        run: node scripts/smoke/base.ts https://localhost

      - name: logs
        if: failure()
        run: docker compose -f deploy/docker-compose.yml logs
